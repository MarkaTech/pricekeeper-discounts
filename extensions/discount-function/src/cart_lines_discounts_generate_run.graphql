query CartInput {
  cart {
    lines {
      id
      quantity
      cost {
        totalAmount { amount currencyCode }
        amountPerQuantity { amount currencyCode }
      }
      merchandise {
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
    buyerIdentity {
      customer {
        id
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:campaign", key: "config") {
      value
    }
  }
}
